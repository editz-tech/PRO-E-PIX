name: Build E-Pix Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out E-Pix
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Download and verify the local AI model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $modelUrl = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx"
          $modelPath = "models/u2net.onnx"
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath
          $actual = (Get-FileHash -Path $modelPath -Algorithm MD5).Hash.ToLower()
          $expected = "60024c5c889badc19c04ad937298a77b"
          if ($actual -ne $expected) { throw "U2Net model checksum mismatch: $actual" }
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Build E-Pix application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "E-Pix" `
            --collect-all rembg --collect-all onnxruntime --collect-all PIL `
            --add-data "models/u2net.onnx;models" app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        run: iscc installer/E-Pix.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: E-Pix-Windows-Installer
          path: dist/installer/E-Pix-Setup.exe
          if-no-files-found: error
          retention-days: 30
