name: Build E-Pix personal Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Build unsigned personal-use executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name E-Pix --collect-all rembg --collect-all onnxruntime --collect-all pooch --collect-all pymatting app.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/E-Pix.exe")) {
            throw "Expected dist/E-Pix.exe was not created."
          }
          $file = Get-Item "dist/E-Pix.exe"
          Write-Host "Created unsigned personal-use executable: $($file.FullName) ($($file.Length) bytes)"

      - name: Upload E-Pix personal-use executable
        uses: actions/upload-artifact@v4
        with:
          name: E-Pix-Personal-Windows-Unsigned
          path: dist/E-Pix.exe
          if-no-files-found: error
